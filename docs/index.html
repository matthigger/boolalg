<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boolean Algebra Explorer — CS1800</title>
<!-- Before the stylesheet, so the page never paints the wrong palette
     and then flips. Same rule as js/theme.js -- a stored choice, else
     the system -- and the same key string; change one, change both. -->
<script>
(function () {
  var v = null;
  try { v = localStorage.getItem('ba-theme'); } catch (e) { /* file:// */ }
  if (v !== 'dark' && v !== 'light') {
    v = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = v;
})();
</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="topbar">
<header>
  <h1>Boolean Algebra Explorer</h1>
  <div class="modes" id="modeToggle" role="tablist" aria-label="view">
    <button data-mode="sets" role="tab">SETS</button>
    <button data-mode="logic" role="tab">LOGIC</button>
    <button data-mode="circuit" role="tab">CIRCUIT</button>
  </div>
  <button id="themeToggle" class="themebtn" type="button"
          aria-label="dark mode" aria-pressed="false" title="dark mode">
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor"
              stroke-width="1.5"/>
      <path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/>
    </svg>
  </button>
</header>
</div>

<main>
  <section class="viewer" id="viewer" aria-label="viewer"></section>

  <section class="expression" id="expression" aria-label="expression">
    <div class="entry">
      <div class="toolrow">
        <div class="oppad" id="opPad"></div>
        <button id="examplesBtn" class="ghost">get example</button>
        <span class="barright" id="exprExport"></span>
      </div>
      <div class="entryrow">
        <label for="src">start from</label>
        <input id="src" spellcheck="false" autocomplete="off"
               placeholder="(A u B)^C   or   (A \cup B)\complement">
        <span class="err" id="srcErr"></span>
      </div>
    </div>
    <div class="lines" id="lines"></div>
  </section>

  <aside class="algebra" aria-label="algebra">
    <div class="rules" id="rules"></div>
    <div class="actions">
      <button id="simplify" class="primary">Simplify</button>
      <div id="simpNote" class="note"></div>
      <div class="hintrow">
        <button id="reset" class="ghost">Reset</button>
        <button id="share" class="ghost">Share</button>
      </div>
    </div>
  </aside>
</main>

<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
