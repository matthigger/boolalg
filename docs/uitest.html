<!doctype html>
<html><head><meta charset="utf-8"><title>ui tests</title>
<link rel="stylesheet" href="./style.css"></head>
<body>
<header><h1>Boolean Algebra Explorer</h1>
  <div class="modes" id="modeToggle"><button data-mode="sets"></button>
  <button data-mode="logic"></button><button data-mode="circuit"></button></div>
</header>
<main>
  <section class="viewer" id="viewer"></section>
  <section class="expression" id="expression">
    <div class="entry">
      <div class="toolrow"><div class="oppad" id="opPad"></div>
        <button id="examplesBtn"></button>
        <span class="barright" id="exprExport"></span></div>
      <div class="entryrow"><input id="src">
      <span class="err" id="srcErr"></span></div></div>
    <div class="lines" id="lines"></div>
  </section>
  <aside class="algebra"><div class="rules" id="rules"></div>
    <div class="actions"><button id="simplify"></button>
      <div id="simpNote"></div><button id="reset"></button>
      <button id="share"></button></div></aside>
</main>
<!-- Same classes as index.html: the overlay's own CSS is under test. -->
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<pre id="out" style="padding:12px;font-size:12px">running…</pre>
<script>
window.addEventListener('error', (e) => {
  document.getElementById('out').textContent =
    'RESULT pass=0 fail=1\nUNCAUGHT ' + e.message + '\n' +
    ((e.error && e.error.stack) || '');
});
// The suite is async, so a thrown error surfaces as a rejected promise
// and never reaches the handler above -- the page just sits on
// "running..." with no clue why.
window.addEventListener('unhandledrejection', (e) => {
  document.getElementById('out').textContent =
    'RESULT pass=0 fail=1\nREJECTED ' + (e.reason && e.reason.message) +
    '\n' + ((e.reason && e.reason.stack) || '');
});
</script>
<script type="module" src="./js/app.js"></script>
<script type="module" src="./js/uitests.js"></script>
</body></html>
